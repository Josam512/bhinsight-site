# Publie la page d'essayage virtuel (cette branche uniquement) sur GitHub Pages.
name: Pages essayage lentilles
on:
  push:
    branches: [essayage-lentilles]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Préparer le site (la page d'essayage seulement)
        run: |
          mkdir -p site
          cp essayage-lentilles.html site/index.html
          cp essayage-lentilles.html site/essayage-lentilles.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
